<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>TechX — Next-Gen Hardware & Modern Tech Ecosystem</title>
    <meta name="description" content="Experience precision-engineered technology. Curated audio, high-performance computing, smart wearables, and advanced gear." />
    <meta name="keywords" content="tech, electronics, headphones, smartwatch, laptop, gadgets, modern tech, audio, hardware" />
    <meta name="author" content="TechX Systems" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TechX — Next-Gen Hardware & Tech Ecosystem" />
    <meta property="og:description" content="Precision engineering meets aesthetic design. Discover curated high-performance tech." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=1200&q=80" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="TechX — Next-Gen Hardware & Tech Ecosystem" />
    <meta property="twitter:description" content="Precision engineering meets aesthetic design. Discover curated high-performance tech." />

    <meta name="theme-color" content="#0b0f19" id="theme-color-meta" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />

    <!-- Core Stylesheet -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Theme initial load script to avoid flash of light/dark -->
    <script>
      (function() {
        const savedTheme = localStorage.getItem('tx-theme') || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', savedTheme);
      })();
    </script>

    <div id="app"></div>

    <!-- Modals and Overlay Portals -->
    <div id="quickview-portal"></div>
    <div id="cart-drawer-portal"></div>
    <div id="search-modal-portal"></div>
    <div id="toast-portal"></div>

    <!-- Application Script -->
    <script type="module" src="app.js"></script>
  </body>
</html>
